# Nginx 反向代理 — 为域名 + HTTPS 准备
#
# 用途：有域名后用 nginx 终止 TLS，把请求转发到宿主机的 8010。
#
# ---------------------------------------------------------------------------
# 启用步骤（在服务器上执行）：
#   1. apt-get install -y nginx certbot python3-certbot-nginx
#   2. cp deploy/nginx.conf /etc/nginx/sites-available/mediatlas
#   3. sed -i 's/__DOMAIN__/你的域名/g' /etc/nginx/sites-available/mediatlas
#   4. ln -s /etc/nginx/sites-available/mediatlas /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#   6. certbot --nginx -d 你的域名          # 自动签发并注入证书配置
#   7. 改 backend/.env：
#        MED_SECURE_COOKIE=true
#        MED_ALLOWED_ORIGINS=https://你的域名
#      然后 bash deploy/ops/sync-env.sh && docker compose ... up -d
#   8. 阿里云安全组放行 80 和 443（8010 可以收回，不再需要对外）
#
# ---------------------------------------------------------------------------
# 两个必须注意的坑（都已在部署时实测确认）：
#
# 1) SSE 的真实路径是 /api/chat，不是 /chat/chat。
#    前端打包产物里是 fetch(`/api/chat`, ...)。早期模板写的是 `location /chat/`，
#    而 /api/chat 并不以 /chat/ 开头 → 会落到下面通用的 location / 块，
#    那里**没有关闭 proxy_buffering** → 流式回答会被 nginx 缓冲，
#    界面上就看不到"制定检索计划 / 执行检索融合"的逐步进度，且 120s 后可能被截断。
#    因此下面用 location = /api/chat（精确匹配，优先级最高）单独处理 SSE。
#
# 2) 加 nginx 后限流会退化成"全站共享一个桶"。
#    应用按 request.client.host 做登录限流（同 IP 每 60 秒 8 次）。
#    nginx 从宿主机 127.0.0.1 发起代理，Docker 会把来源改写成网关 172.18.0.1，
#    于是所有用户看起来都是同一个 IP → 8 次/分钟被全站共享，很快互相挤爆。
#    解决办法：让 uvicorn 信任来自 Docker 网段的 X-Forwarded-For。
#    已在 deploy/docker-compose.yml 里加好：
#        FORWARDED_ALLOW_IPS: 172.16.0.0/12,127.0.0.1
#    （uvicorn 0.51 支持 CIDR，已实测确认。用 /12 覆盖 Docker 默认地址池的全部
#     172.16–172.31，避免网络重建后子网变化导致失效）
# ---------------------------------------------------------------------------

upstream mediatlas_app {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot 会在这里插入 301 跳转到 https

    client_max_body_size 4m;
    client_body_timeout 30s;

    # 安全响应头（HTTPS 生效后再打开 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- SSE 流式问答：必须关闭缓冲 ----
    # 精确匹配真实路径；同时保留 /chat/chat 这个应用内置别名。
    location = /api/chat {
        proxy_pass http://mediatlas_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 关闭一切缓冲，保证 token 实时到达
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # 覆盖应用完整预算（MED_REQUEST_TIMEOUT=240）并留余量
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location = /chat/chat {
        proxy_pass http://mediatlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ---- 其余接口与静态资源 ----
    location / {
        proxy_pass http://mediatlas_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 静态资源长缓存
    location /assets/ {
        proxy_pass http://mediatlas_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
