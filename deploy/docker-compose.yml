# MediAtlas 生产编排（2 vCPU / 8 GiB 无 GPU）
# 用法：docker compose --env-file deploy/.env.production up -d --build
name: mediatlas

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mediatlas-app:1.0.0
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # 容器内固定值覆盖：让应用连接 compose 内的服务名
      MED_HOST: 0.0.0.0
      MED_PORT: "8010"
      MED_DATABASE_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MED_REDIS_URL: redis://redis:6379/0
      MED_NEO4J_URI: bolt://neo4j:7687
      MED_MODEL_DEVICE: cpu
      MED_MAX_CONCURRENT_CHATS: "3"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      # 上了宿主机 nginx 反向代理后必须设这一项，否则限流会失效。
      # 原因：应用按 request.client.host 限流（同 IP 每 60 秒 8 次登录）。
      # nginx 从宿主机 127.0.0.1 代理进来，Docker 会把来源改写成网关 172.18.0.1，
      # 于是所有用户看起来是同一个 IP，8 次/分钟被全站共享，很快互相挤爆。
      # 这里让 uvicorn 信任 Docker 网段传来的 X-Forwarded-For（0.51 支持 CIDR，已实测）。
      # 用 172.16.0.0/12 而非具体子网：compose 网络重建后子网可能从 172.18 变成别的，
      # 这个范围覆盖 Docker 默认地址池的全部 172.16–172.31，避免日后失效。
      # 直接访问 8010 时该设置无副作用：来源不是网段内地址，XFF 一律不被采信。
      FORWARDED_ALLOW_IPS: 172.16.0.0/12,127.0.0.1
    ports:
      # 仅暴露应用端口；数据库/缓存/图库只在 compose 网络内可达
      - "8010:8010"
    volumes:
      # 语料与索引：可写，因为首次运行可能需要生成/更新向量索引缓存
      # （容器内模型路径与本地不同时，缓存 key 会变化，需要重新编码一次）
      - ../data:/app/data
      - ../reports:/app/reports
      - ./models:/models:ro
      - hf_cache:/home/mediatlas/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: ${POSTGRES_DATABASE:-medical_agentic_rag}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediatlas} -d ${POSTGRES_DATABASE:-medical_agentic_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.production}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.production}
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env.production}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 384m
      NEO4J_dbms_security_procedures_unrestricted: ""
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 1600m
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  hf_cache:
